name: Generate Achievements Card

on:
  push:
    paths:
      - 'data/profile.json'      # 数据文件变动时触发
      - 'scripts/generate_card.py'
  schedule:
    - cron: '0 0 * * *'          # 每天 UTC 0 点自动更新
  workflow_dispatch:            # 支持手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install Pillow
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core

      - name: 生成卡片
        run: python scripts/generate_card.py

      - name: 提交并推送图片
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add images/achievements-card.png
          git diff --staged --quiet || git commit -m "🔄 自动更新成就卡片"
          git push